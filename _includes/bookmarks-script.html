<!-- Bookmarks Feature Component -->
<style>
  /* Bookmark Buttons Styling */
  .btn-bookmark {
    transition: all 0.2s ease-in-out;
  }
  .btn-bookmark.bookmarked {
    background-color: var(--bs-primary, #0d6efd) !important;
    border-color: var(--bs-primary, #0d6efd) !important;
    color: #ffffff !important;
  }
  .btn-bookmark.bookmarked i {
    font-weight: 900 !important;
  }
  .btn-card-bookmark {
    background: transparent;
    border: none;
    color: var(--text-muted-color, #828282);
    padding: 2px 6px;
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.15s ease, color 0.15s ease;
  }
  .btn-card-bookmark:hover {
    transform: scale(1.22);
    color: var(--bs-primary, #0d6efd) !important;
  }
  .btn-card-bookmark.bookmarked {
    color: var(--bs-primary, #0d6efd) !important;
  }
  .btn-card-bookmark.bookmarked i {
    font-weight: 900 !important;
  }

  /* Toast Notification */
  #sedunlab-toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 10500;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  @media (max-width: 576px) {
    #sedunlab-toast-container {
      left: 16px;
      right: 16px;
      bottom: 16px;
      align-items: center;
    }
  }
  .sedunlab-toast {
    pointer-events: auto;
    background: rgba(24, 26, 32, 0.94);
    color: #f8f9fa;
    padding: 10px 18px;
    border-radius: 50px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    animation: toastSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .sedunlab-toast a {
    color: #60a5fa !important;
    font-weight: 600;
    text-decoration: underline;
  }
  @keyframes toastSlideUp {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastSlideDown {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(12px) scale(0.96); }
  }
</style>

<div id="sedunlab-toast-container" aria-live="polite"></div>

<script>
(function() {
  const BM_KEY = 'sedunlab_bookmarks';
  const bookmarksUrl = '{{ "/bookmarks/" | relative_url }}';

  function isEnglish() {
    return window.location.pathname.startsWith('/en/') || 
           window.location.pathname.includes('-en/') || 
           sessionStorage.getItem('lang-override') === 'en';
  }

  function normalizeUrl(url) {
    if (!url) return '';
    try {
      const u = new URL(url, window.location.origin);
      let path = u.pathname.replace(/\/+$/, '');
      return path ? path + '/' : '/';
    } catch(e) {
      return url.replace(/\/+$/, '') + '/';
    }
  }

  function getBookmarks() {
    try {
      const raw = localStorage.getItem(BM_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) {
      console.warn('Bookmarks storage access error:', e);
      return [];
    }
  }

  function saveBookmarks(list) {
    try {
      localStorage.setItem(BM_KEY, JSON.stringify(list));
    } catch(e) {
      console.warn('Bookmarks write error:', e);
    }
    updateAllUI();
  }

  function isBookmarked(url) {
    const target = normalizeUrl(url);
    const list = getBookmarks();
    return list.some(item => normalizeUrl(item.url) === target);
  }

  function showToast(htmlMessage) {
    let container = document.getElementById('sedunlab-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'sedunlab-toast-container';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = 'sedunlab-toast';
    toast.innerHTML = htmlMessage;
    container.appendChild(toast);

    setTimeout(() => {
      toast.style.animation = 'toastSlideDown 0.25s forwards';
      setTimeout(() => toast.remove(), 260);
    }, 2800);
  }

  function updateSidebarCount(count) {
    const badge = document.getElementById('sidebar-bookmark-count');
    if (badge) {
      if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('d-none');
      } else {
        badge.textContent = '0';
        badge.classList.add('d-none');
      }
    }
  }

  function updateButtonState(btn, active) {
    const isEn = isEnglish();
    const icon = btn.querySelector('i');
    const label = btn.querySelector('.bookmark-text');

    if (active) {
      btn.classList.add('bookmarked');
      if (icon) {
        icon.className = 'fas fa-bookmark' + (btn.classList.contains('btn-bookmark') ? ' me-1' : '');
      }
      if (label) {
        label.textContent = isEn ? 'Bookmarked' : 'В обраному';
      }
      btn.setAttribute('title', isEn ? 'Remove from bookmarks' : 'Видалити з обраного');
    } else {
      btn.classList.remove('bookmarked');
      if (icon) {
        icon.className = 'far fa-bookmark' + (btn.classList.contains('btn-bookmark') ? ' me-1' : '');
      }
      if (label) {
        label.textContent = isEn ? 'Bookmark' : 'В обране';
      }
      btn.setAttribute('title', isEn ? 'Save to bookmarks' : 'Додати в обране');
    }
  }

  function updateAllUI() {
    const list = getBookmarks();
    updateSidebarCount(list.length);

    /* Update post & card buttons */
    const allBtns = document.querySelectorAll('.btn-bookmark, .btn-card-bookmark');
    allBtns.forEach(btn => {
      const url = btn.getAttribute('data-url');
      if (url) {
        updateButtonState(btn, isBookmarked(url));
      }
    });

    /* If on bookmarks page, refresh grid */
    if (typeof window.renderBookmarksPage === 'function') {
      window.renderBookmarksPage();
    }
  }

  window.toggleBookmark = function(btn) {
    if (!btn) return;
    const url = btn.getAttribute('data-url');
    if (!url) return;

    const isEn = isEnglish();
    let list = getBookmarks();
    const target = normalizeUrl(url);
    const existingIndex = list.findIndex(item => normalizeUrl(item.url) === target);

    if (existingIndex >= 0) {
      list.splice(existingIndex, 1);
      saveBookmarks(list);
      showToast(isEn ? '🔖 Removed from <a href="' + bookmarksUrl + '">Bookmarks</a>' : '🔖 Статтю вилучено з <a href="' + bookmarksUrl + '">Обраного</a>');
    } else {
      const item = {
        url: url,
        title: btn.getAttribute('data-title') || document.title,
        date: btn.getAttribute('data-date') || '',
        categories: btn.getAttribute('data-categories') || '',
        image: btn.getAttribute('data-image') || '',
        description: btn.getAttribute('data-description') || '',
        saved_at: Date.now()
      };
      list.unshift(item);
      saveBookmarks(list);
      showToast(isEn ? '🔖 Saved to <a href="' + bookmarksUrl + '">Bookmarks</a>' : '🔖 Статтю збережено в <a href="' + bookmarksUrl + '">Обране</a>');
    }
  };

  window.removeBookmark = function(url) {
    if (!url) return;
    const isEn = isEnglish();
    let list = getBookmarks();
    const target = normalizeUrl(url);
    list = list.filter(item => normalizeUrl(item.url) !== target);
    saveBookmarks(list);
    showToast(isEn ? 'Статтю видалено' : 'Статтю видалено з Обраного');
  };

  window.clearAllBookmarks = function() {
    const isEn = isEnglish();
    const msg = isEn ? 'Are you sure you want to clear all bookmarked articles?' : 'Ви впевнені, що хочете видалити всі збережені статті з обраного?';
    if (confirm(msg)) {
      try {
        localStorage.removeItem(BM_KEY);
      } catch(e) {}
      updateAllUI();
      showToast(isEn ? 'All bookmarks cleared' : 'Усі закладки очищено');
    }
  };

  window.getSedunlabBookmarks = getBookmarks;
  window.updateBookmarksUI = updateAllUI;
  window.showBookmarkToast = showToast;
  window.isSedunlabEnglish = isEnglish;

  /* Cross-tab synchronization */
  window.addEventListener('storage', function(e) {
    if (e.key === BM_KEY) {
      updateAllUI();
    }
  });

  /* Init on DOM ready */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateAllUI);
  } else {
    updateAllUI();
  }
})();
</script>
